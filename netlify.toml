plugins = []

# Allow the Sanity Studio (hosted elsewhere) to fetch the site HTML
# for the "Aperçu / معاينة" full-site preview before publishing.
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[dev]
command = "npm run dev"
targetPort = 3000
port = 8888

[functions]

  [functions."*"]

[build]
publish = "."
publishOrigin = "config"
commandOrigin = "config"
command = ""

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]